packages:
  - 'packages/*'

allowBuilds:
  '@clerk/shared': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# pnpm 11+: canonical overrides live here.
# package.json#pnpm.overrides is kept in sync for Vercel (pnpm 9) frozen installs.
overrides:
  esbuild: 0.25.12
  postcss: 8.5.29
  fast-uri: 3.1.8
  browserslist: 4.28.7
  baseline-browser-mapping: 2.11.0
  brace-expansion: 1.1.21
  postcss-selector-parser: 7.1.6
  "js-yaml@3": 3.15.2
  "js-yaml@4": 4.3.2
  prismjs: 1.30.0
  serialize-javascript: 7.0.5
