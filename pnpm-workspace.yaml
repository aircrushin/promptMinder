packages:
  - 'packages/*'

allowBuilds:
  '@clerk/shared': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# pnpm 11+: canonical overrides live here.
# package.json#pnpm.overrides is kept in sync for Vercel (pnpm 9) frozen installs.
overrides:
  esbuild: 0.25.12
  postcss: 8.5.19
  prismjs: 1.30.0
  serialize-javascript: 7.0.5
